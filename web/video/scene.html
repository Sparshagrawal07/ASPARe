const ribbonItems = [["AWS S3", C.sun], ["Azure Blob Storage", C.sky], ["Google Cloud Storage", C.mint], ["Public access", C.coral], ["Encryption at rest", C.lilac], ["Versioning", C.pink], ["HTTPS only", C.peri], ["CIS Foundations", C.sun], ["AWS FSBP", C.sky], ["Least privilege", C.mint], ["Full audit trail", C.lilac]];
const ribbon = el("div", "abs", "", { left: 0, top: "1010px", width: "1920px", height: "70px", background: "#fff", borderTop: "4px solid #1c1b3a", overflow: "hidden", display: "none" });
const rtrack = el("div", "abs", ribbonItems.concat(ribbonItems).concat(ribbonItems).map(([t, c]) => `<span class="chip" style="background:${c};margin:10px 12px;color:${c === C.coral || c === C.peri ? "#fff" : "#1c1b3a"}">${t}</span>`).join(""), { left: 0, top: 0, whiteSpace: "nowrap" }); ribbon.appendChild(rtrack); stage.appendChild(ribbon);

/* ---------- wipes + HUD ---------- */
const WIPE_T = [1.5, 3.9, 7.0, 10.0, 12.7];
const PAL = [[C.peri, C.coral, C.sun, C.mint, C.sky], [C.sky, C.sun, C.pink, C.peri, C.coral], [C.mint, C.lilac, C.coral, C.sky, C.sun], [C.coral, C.peri, C.mint, C.sun, C.lilac], [C.sun, C.sky, C.coral, C.mint, C.peri]];
const wipesEl = document.getElementById("wipes");
const bars = WIPE_T.map((T, w) => PAL[w].map((c, i) => { const b = el("div", "bar", "", { left: i * 20 + "%", background: c, border: "4px solid #1c1b3a", transform: "translateY(110%)" }); wipesEl.appendChild(b); return b; }));
set(wipesEl, { position: "absolute", inset: 0, pointerEvents: "none" });
const hud = document.getElementById("hud");
const prog = el("div", "abs", "", { left: 0, bottom: 0, height: "12px", width: "1920px", background: "rgba(28,27,58,.12)" }); const progFill = el("div", "abs", "", { left: 0, top: 0, height: "12px", width: 0, background: C.ink }); prog.appendChild(progFill); hud.appendChild(prog);
const chapter = el("div", "abs mono", "", { right: "50px", top: "28px", fontSize: "26px", fontWeight: 700, color: "#1c1b3a", background: "#fff", border: "3px solid #1c1b3a", borderRadius: "99px", padding: "4px 18px" }); hud.appendChild(chapter);
const CH = ["01 / ASPARe", "02 / Connect", "03 / Detect", "04 / Decide", "05 / Fix + verify", "06 / Start free"];

/* ================================ TIMELINE ================================ */
function seek(t) {
  t = clamp(t, 0, DUR - 0.001);
  const idx = WIPE_T.filter((T) => t >= T).length;           // which scene is active (switch happens under the wipe)
  [s1, s2, s3, s4, s5, s6].forEach((s, i) => (s.style.display = i === idx ? "block" : "none"));
  const start = idx === 0 ? 0 : WIPE_T[idx - 1] + 0.3, end = idx === 5 ? DUR : WIPE_T[idx] + 0.3;
  const lt = t - start;                                       // time inside the scene
  const kz = P(t, start - 0.3, end - start + 0.3);
  const sc = [s1, s2, s3, s4, s5, s6][idx];
  tf(sc, mix(-8, 8, kz), 0, mix(1, 1.035, E.lin(kz)));       // slow camera push

  /* parallax background */
  shapes.forEach((s, i) => tf(s.e, Math.sin(t * 0.6 + i) * 24 * s.k, Math.cos(t * 0.5 + i * 1.7) * 20 * s.k, 1 + Math.sin(t * 0.8 + i) * 0.03, t * 6 * (i % 2 ? 1 : -1) * 0.3));
  plus.forEach((p) => tf(p.e, 0, Math.sin(t * 1.4 + p.i) * 14, 1, t * 40 * (p.i % 2 ? 1 : -1)));

  /* ---- scene 1 ---- */
  if (idx === 0) {
    const a = E.out3(P(lt, 0.05, 0.7)), b = P(lt, 0.55, 0.4);
    const lp1 = logo.querySelector(".lp1"), lp2 = logo.querySelector(".lp2");
    lp1.setAttribute("pathLength", 1); lp1.style.strokeDasharray = 1; lp1.style.strokeDashoffset = 1 - a; lp1.style.fillOpacity = E.out3(P(lt, 0.45, 0.4));
    lp2.setAttribute("pathLength", 1); lp2.style.strokeDasharray = 1; lp2.style.strokeDashoffset = 1 - E.out3(P(lt, 0.7, 0.35));
    tf(logo, 0, mix(60, 0, E.outBack(P(lt, 0.0, 0.7))), mix(0.4, 1, E.outBack2(P(lt, 0.0, 0.8))), mix(-30, 0, E.outBack(P(lt, 0, 0.8))));
    wmL.forEach((l, i) => { const p = P(lt, 0.45 + i * 0.05, 0.5); tf(l, 0, mix(220, 0, E.outBack2(p)), mix(0.5, 1, E.outBack(p)), mix(i % 2 ? 14 : -14, 0, E.out3(p))); l.style.opacity = clamp(p * 3); });
    const pt = P(lt, 0.8, 0.5); tf(s1tag, 0, mix(40, 0, E.out3(pt))); s1tag.style.opacity = pt;
    const pc = P(lt, 0.9, 0.5); tf(s1chip, 0, 0, mix(0, 1, E.outBack2(pc)), mix(20, -4, E.outBack(pc))); s1chip.style.opacity = clamp(pc * 4);
    s1.style.display = "block";
  }

  /* ---- scene 2 ---- */
  if (idx === 1) {
    [h1a, h1b].forEach((ws, L) => ws.forEach((w, i) => { const p = P(lt, 0.05 + L * 0.35 + i * 0.09, 0.6); tf(w, 0, mix(150, 0, E.outExpo(p)), 1, mix(6, 0, E.out3(p))); }));
    document.getElementById("sq").style.strokeDashoffset = 1 - E.inOut(P(lt, 1.0, 0.6));
    const pm = P(lt, 0.5, 0.9);
    s2mascot.innerHTML = MASCOT(420, (lt > 1.5 && lt < 1.8) || lt > 2.3);
    tf(s2mascot, 0, mix(520, Math.sin(t * 3) * -10, E.outBack2(pm)), mix(0.6, 1, E.outBack(pm)), mix(-25, 4, E.out3(pm)));
    steps.forEach((e, i) => { const p = P(lt, 1.2 + i * 0.22, 0.55); tf(e, 0, mix(160, 0, E.outBack2(p)), mix(0.8, 1, E.outBack(p)), mix(i % 2 ? 6 : -6, i - 1, E.out3(p))); e.style.opacity = clamp(p * 3); });
    const ps = P(lt, 1.9, 0.5); s2sub.style.opacity = ps; tf(s2sub, mix(-40, 0, E.out3(ps)), 0);
  }

  /* ---- scene 3 ---- */
  if (idx === 2) {
    tf(T3, 0, 0, 1, 0, ""); set(T3, { opacity: clamp(P(lt, 0.05, 0.3) * 3) });
    [...T3.childNodes].length; T3.style.clipPath = `inset(0 ${(1 - E.outExpo(P(lt, 0.05, 0.6))) * 100}% 0 0)`;
    cards3.forEach((c, i) => {
      const p = P(lt, 0.0 + i * 0.12, 0.6);
      tf(c.e, mix(-700, 0, E.outBack(p)), 0, 1, mix(i % 2 ? 4 : -4, 0, E.out3(p))); c.e.style.opacity = clamp(p * 3);
      const fl = P(lt, 0.9 + i * 0.32, 0.28), on = fl > 0.5;                                  // flip the switch: real misconfiguration
      const sw = c.sw.querySelector(".sw"), kn = sw.querySelector("i");
      const k = E.out3(fl);
      sw.style.background = fl > 0 ? (on ? "#ff6b57" : "#2ed3a0") : "#2ed3a0"; kn.style.left = mix(41, 3, k) + "px";
      c.sw.style.background = fl > 0.1 ? "#ffe3de" : "transparent";
      const sw2 = c.e.querySelector(".sw2 .sw"); sw2.style.background = "#2ed3a0"; sw2.querySelector("i").style.left = "41px";
      c.badge.textContent = on ? `${c.issues} issues` : "healthy"; c.badge.style.background = on ? "#ff6b57" : "#2ed3a0"; c.badge.style.color = on ? "#fff" : "#1c1b3a";
      if (fl > 0 && fl < 1) tf(c.e, mix(-700, 0, 1) + Math.sin(fl * 30) * 6 * (1 - fl), 0, 1 + Math.sin(fl * Math.PI) * 0.015, 0);
    });
    tiles.forEach((tl, i) => { const p = P(lt, 1.7 + i * 0.12, 0.6); tf(tl.e, 0, mix(120, 0, E.outBack2(p)), mix(0.7, 1, E.outBack(p)), mix(i % 2 ? 5 : -5, 0, E.out3(p))); tl.e.style.opacity = clamp(p * 3); tl.n.textContent = Math.round(tl.v * E.out3(P(lt, 1.9 + i * 0.12, 0.8))); });
    const pi = P(lt, 2.2, 0.6); tf(inc, mix(500, 0, E.outBack(pi)), 0, 1, mix(3, 0, E.out3(pi))); inc.style.opacity = clamp(pi * 3);
  }

  /* ---- scene 4 ---- */
  if (idx === 3) {
    set(T4, { clipPath: `inset(0 ${(1 - E.outExpo(P(lt, 0.0, 0.7))) * 100}% 0 0)` });
    [dA, dB].forEach((d, side) => {
      const p = P(lt, 0.15 + side * 0.15, 0.7);
      tf(d.e, mix(side ? 900 : -900, 0, E.outExpo(p)), mix(40, 0, E.out3(p)), 1, mix(side ? 8 : -8, side ? 0.6 : -0.6, E.outBack(p)));
      const cp = E.out3(P(lt, 0.7 + side * 0.15, 1.0)), val = d.f.confidence;
      d.fill.style.width = val * 100 * cp + "%"; d.fill.style.background = side ? C.sun : C.peri;
      d.cf.textContent = `confidence ${Math.round(val * 100 * cp)}%`;
      d.lis.forEach((li, i) => { const q = P(lt, 1.2 + i * 0.35 + side * 0.1, 0.4); li.style.opacity = q; li.style.transform = `translateX(${mix(40, 0, E.out3(q))}px)`; });
      if (side === 0) { const q = P(lt, 1.9, 0.5); d.sigs.style.opacity = q; d.sigs.style.transform = `translateY(${mix(20, 0, E.out3(q))}px)`; }
    });
    const m = P(lt, 1.7, 0.45);                                                                // the marketing card flips Auto-fix -> Held for a human
    dB.chip.textContent = m < 0.5 ? "Auto-fix" : "Held for a human"; dB.chip.style.background = m < 0.5 ? C.mint : C.sun;
    dB.chip.style.transform = `scale(${1 + Math.sin(m * Math.PI) * 0.35}) rotate(${Math.sin(m * Math.PI) * -6}deg)`; dB.chip.style.textDecoration = "none";
    const q = P(lt, 2.0, 0.5); dB.note.style.opacity = q; dB.note.style.transform = `translateY(${mix(16, 0, E.out3(q))}px)`;
  }

  /* ---- scene 5 ---- */
  if (idx === 4) {
    set(T5, { clipPath: `inset(0 ${(1 - E.outExpo(P(lt, 0.0, 0.7))) * 100}% 0 0)` });
    const pb = P(lt, 0.2, 0.6), pa = P(lt, 0.9, 0.7), pw = P(lt, 0.7, 0.5);
    tf(before, mix(-800, 0, E.outExpo(pb)), 0, 1, mix(-5, -1, E.outBack(pb)));
    tf(after, mix(800, 0, E.outExpo(pa)), 0, 1, mix(5, 1, E.outBack(pa)));
    tf(wand, 0, 0, mix(0, 1, E.outBack2(pw)), mix(-180, 0, E.out3(pw)));
    const strike = P(lt, 0.9, 0.5);
    before.querySelectorAll(".chg").forEach((n) => (n.style.textDecorationColor = `rgba(214,56,42,${strike})`));
    const pv = P(lt, 1.35, 0.5);
    tf(ver, 0, mix(160, 0, E.outBack2(pv)), mix(0.8, 1, E.outBack(pv)), 0); ver.style.opacity = clamp(pv * 3);
    const vc = ver.querySelector(".vc"), vp = P(lt, 1.5, 0.5); tf(vc, 0, 0, mix(0, 1, E.outBack2(vp)), mix(-90, 0, E.out3(vp)));
    const rp = P(lt, 1.7, 0.9), ring = ver.querySelector(".ring"); ring.style.transform = `scale(${mix(1, 1.7, E.out3(rp))})`; ring.style.opacity = 1 - rp;
    const tp = P(lt, 1.35, 0.3); term.style.opacity = tp; tf(term, 0, mix(60, 0, E.out3(tp)));
    termEls.forEach((n, i) => { const k = P(lt, 1.75 + i * 0.24, 0.2); n.style.opacity = k; n.style.transform = `translateX(${mix(30, 0, E.out3(k))}px)`; });
  }

  /* ---- scene 6 ---- */
  if (idx === 5) {
    const pb = P(lt, 0.0, 0.7); tf(band, 0, mix(1100, 0, E.outExpo(pb)), 1, mix(-3, 0, E.outBack(pb)));
    o1.forEach((w, i) => { const p = P(lt, 0.3 + i * 0.16, 0.6); tf(w, 0, mix(190, 0, E.outExpo(p)), 1, mix(5, 0, E.out3(p))); });
    s6stats.forEach((e, i) => { const p = P(lt, 0.75 + i * 0.1, 0.5); tf(e, 0, mix(120, 0, E.outBack2(p)), mix(0.8, 1, E.outBack(p)), mix(i % 2 ? 5 : -5, 0, E.out3(p))); e.style.opacity = clamp(p * 3); });
    const pc = P(lt, 0.95, 0.5), press = P(lt, 1.4, 0.25);
    tf(cta, mix(-120, 0, E.outBack2(pc)), mix(80, 0, E.outBack(pc)), (1 + (press < 1 ? Math.sin(press * Math.PI) * -0.07 : 0)), 0, "");
    cta.style.boxShadow = `${8 - Math.sin(press * Math.PI) * 6}px ${8 - Math.sin(press * Math.PI) * 6}px 0 #1c1b3a`; cta.style.opacity = clamp(pc * 3);
    const pu = P(lt, 1.2, 0.5); tf(url, mix(80, 0, E.outBack(pu)), 0, mix(0.7, 1, E.outBack2(pu))); url.style.opacity = clamp(pu * 3);
    const pm = P(lt, 0.6, 0.8); s6m.innerHTML = MASCOT(380, lt > 1.5 && lt < 1.75); tf(s6m, 0, mix(500, Math.sin(t * 3) * -8, E.outBack2(pm)), mix(0.6, 1, E.outBack(pm)), mix(20, -4, E.out3(pm)));
    ribbon.style.display = "block"; tf(rtrack, -((lt * 220) % 1700), 0);
  } else ribbon.style.display = "none";

  /* ---- wipes (real brand palette, staggered, cover then reveal) ---- */
  bars.forEach((row, w) => row.forEach((b, i) => {
    const T = WIPE_T[w], c = E.inOut(P(t, T - 0.45 + i * 0.045, 0.34)), r = E.inOut(P(t, T + 0.0 + i * 0.045, 0.34));
    const y = r > 0 ? mix(0, -110, r) : mix(110, 0, c);
    b.style.transform = `translateY(${y}%)`;
  }));
  progFill.style.width = (t / DUR) * 1920 + "px";
  chapter.textContent = CH[idx];
}
window.seek = seek;
